<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محرر الأكواد الاحترافي</title>
    <!-- استيراد خط Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- مكتبة الأيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 12px;
            overflow: hidden;
        }

        /* شريط الأدوات العلوي المطابق للصورة */
        .toolbar {
            display: flex;
            gap: 6px;
            background: rgba(18, 18, 18, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px;
            border-radius: 14px;
            overflow-x: auto;
            backdrop-filter: blur(12px);
            margin-bottom: 12px;
            scrollbar-width: none; /* إخفاء الشريط في متصفحات فايرفوكس */
        }

        .toolbar::-webkit-scrollbar {
            display: none; /* إخفاء الشريط في الكروم */
        }

        .tool-btn {
            background: rgba(30, 30, 30, 0.9);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 34px;
            height: 34px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
            font-size: 14px;
        }

        .tool-btn:hover {
            background: rgba(50, 50, 50, 1);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .tool-btn:active {
            transform: scale(0.95);
        }

        /* منطقة كتابة الكود */
        .editor-container {
            flex: 1;
            display: flex;
            position: relative;
            background: rgba(10, 10, 10, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        textarea {
            width: 100%;
            height: 100%;
            background: transparent;
            color: #e0e0e0;
            border: none;
            padding: 16px;
            font-size: 15px;
            font-family: 'Courier New', Courier, monospace; /* خط مخصص للأكواد البرمجية */
            resize: none;
            outline: none;
            line-height: 1.6;
            direction: ltr; /* اتجاه الكتابة LTR ليناسب الأكواد البرمجية */
            text-align: left;
        }

        textarea::placeholder {
            color: rgba(255, 255, 255, 0.3);
            font-family: 'Cairo', sans-serif;
            direction: rtl;
            text-align: right;
        }

        /* نافذة المعيِنة أو النتائج السريعة (اختياري) */
        .output-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            flex-direction: column;
            padding: 20px;
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .close-output {
            background: #ff4444;
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        iframe {
            flex: 1;
            background: #ffffff;
            border-radius: 10px;
            border: none;
        }
    </style>
</head>
<body>

    <!-- عنصر مخفي لضمان عمل الوظائف البرمجية السابقة دون أخطاء -->
    <select id="languageSelect" style="display: none;">
        <option value="html" selected>HTML / CSS / JS</option>
        <option value="python">Python</option>
        <option value="javascript">JavaScript</option>
        <option value="cpp">C++</option>
        <option value="java">Java</option>
    </select>

    <!-- شريط الألواح والأدوات (يحتوي الآن على زر الإعدادات كأحد الأزرار) -->
    <div class="toolbar">
        <button class="tool-btn" onclick="runCode()" title="تشغيل / معاينة"><i class="fa-solid fa-play"></i></button>
        <button class="tool-btn" onclick="undoCode()" title="تراجع"><i class="fa-solid fa-rotate-left"></i></button>
        <button class="tool-btn" onclick="redoCode()" title="إعادة"><i class="fa-solid fa-rotate-right"></i></button>
        <button class="tool-btn" onclick="formatCode()" title="تنسيق الكود"><i class="fa-solid fa-globe"></i></button>
        <button class="tool-btn" onclick="downloadCode()" title="تحميل الملف"><i class="fa-solid fa-download"></i></button>
        <button class="tool-btn" onclick="clearEditor()" title="حذف الكل"><i class="fa-solid fa-trash-can"></i></button>
        <button class="tool-btn" onclick="pasteCode()" title="لصق"><i class="fa-solid fa-clipboard"></i></button>
        <button class="tool-btn" onclick="copyCode()" title="نسخ الكود"><i class="fa-solid fa-copy"></i></button>
        <button class="tool-btn" onclick="openSettings()" title="الإعدادات"><i class="fa-solid fa-gear"></i></button>
    </div>

    <!-- مساحة إدخال الكود -->
    <div class="editor-container">
        <textarea id="codeArea" placeholder="اكتب الكود هنا..."></textarea>
    </div>

    <!-- نافذة المعاينة (تظهر عند تشغيل كود HTML) -->
    <div class="output-modal" id="outputModal">
        <div class="output-header">
            <span id="outputTitle">معاينة النتيجة</span>
            <button class="close-output" onclick="closeOutput()">✕</button>
        </div>
        <iframe id="previewFrame"></iframe>
    </div>

    <script>
        const codeArea = document.getElementById('codeArea');
        const langSelect = document.getElementById('languageSelect');
        const RAPIDAPI_KEY = "fa11d9018d62133f96db03a1a222e689";

        // مكدس خاص لإدارة التراجع والإعادة بدقة داخل الـ Textarea
        let undoStack = [];
        let redoStack = [];
        let isInternalChange = false;

        codeArea.addEventListener('input', () => {
            if (isInternalChange) return;
            undoStack.push(codeArea.value);
            redoStack = []; // تفريغ مكدس الإعادة عند كتابة نص جديد
        });

        function undoCode() {
            if (undoStack.length > 0) {
                isInternalChange = true;
                redoStack.push(codeArea.value);
                const previousState = undoStack.pop();
                codeArea.value = previousState;
                isInternalChange = false;
            }
        }

        function redoCode() {
            if (redoStack.length > 0) {
                isInternalChange = true;
                undoStack.push(codeArea.value);
                const nextState = redoStack.pop();
                codeArea.value = nextState;
                isInternalChange = false;
            }
        }

        // دالة زر الإعدادات
        function openSettings() {
            alert('لوحة الإعدادات قيد التطوير.');
        }

        // نسخ الكود
        function copyCode() {
            codeArea.select();
            navigator.clipboard.writeText(codeArea.value);
            alert('تم نسخ الكود بنجاح!');
        }

        // لصق الكود (تم إصلاحها بالطريقة الحديثة للتعامل مع الحافظة)
        async function pasteCode() {
            try {
                if (navigator.clipboard && navigator.clipboard.readText) {
                    const text = await navigator.clipboard.readText();
                    const startPos = codeArea.selectionStart;
                    const endPos = codeArea.selectionEnd;
                    codeArea.value = codeArea.value.substring(0, startPos) + text + codeArea.value.substring(endPos);
                    codeArea.selectionStart = codeArea.selectionEnd = startPos + text.length;
                    codeArea.focus();
                    undoStack.push(codeArea.value);
                } else {
                    alert('خاصية اللصق غير مدعومة مباشرة في متصفحك، يرجى استخدام الاختصار (Ctrl + V).');
                }
            } catch (err) {
                alert('فشل اللصق، يرجى السماح بصلاحيات الوصول للحافظة أو استخدام اختصار الكيبورد (Ctrl + V).');
            }
        }

        // مسح المحتوى
        function clearEditor() {
            if (confirm('هل أنت متأكد من مسح جميع المحتوى؟')) {
                undoStack.push(codeArea.value);
                codeArea.value = '';
                redoStack = [];
            }
        }

        // تحميل الملف بالصيغة الصحيحة بناءً على اللغة المحددة
        function downloadCode() {
            const code = codeArea.value;
            const lang = langSelect.value;
            let extension = 'txt';

            if (lang === 'html') extension = 'html';
            else if (lang === 'python') extension = 'py';
            else if (lang === 'javascript') extension = 'js';
            else if (lang === 'cpp') extension = 'cpp';
            else if (lang === 'java') extension = 'java';

            const blob = new Blob([code], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `script.${extension}`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // تشغيل الكود ومعاينته (مع دعم تشغيل بايثون عبر API)
        async function runCode() {
            const code = codeArea.value;
            const lang = langSelect.value;
            const modal = document.getElementById('outputModal');
            const iframe = document.getElementById('previewFrame');
            const outputTitle = document.getElementById('outputTitle');

            if (lang === 'html') {
                outputTitle.innerText = "معاينة النتيجة";
                modal.style.display = 'flex';
                const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                iframeDoc.open();
                iframeDoc.write(code);
                iframeDoc.close();
            } else if (lang === 'python') {
                outputTitle.innerText = "نتيجة تنفيذ Python";
                modal.style.display = 'flex';
                const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                iframeDoc.open();
                iframeDoc.write("<html><body style='background:#1e1e1e; color:#fff; font-family:monospace; padding:15px; direction:ltr; text-align:left;'>جاري تشغيل الكود عبر السيرفر...</body></html>");
                iframeDoc.close();

                try {
                    // إرسال طلب إلى Judge0 عبر RapidAPI
                    const response = await fetch("https://judge0-ce.p.rapidapi.com/submissions?base64_encoded=false&wait=true", {
                        method: "POST",
                        headers: {
                            "content-type": "application/json",
                            "X-RapidAPI-Key": RAPIDAPI_KEY,
                            "X-RapidAPI-Host": "judge0-ce.p.rapidapi.com"
                        },
                        body: JSON.stringify({
                            source_code: code,
                            language_id: 71 // معرف لغة Python في Judge0
                        })
                    });

                    const result = await response.json();
                    let outputText = "";

                    if (result.stdout) {
                        outputText = result.stdout;
                    } else if (result.stderr) {
                        outputText = "خطأ:\n" + result.stderr;
                    } else if (result.compile_output) {
                        outputText = "خطأ في الترجمة:\n" + result.compile_output;
                    } else {
                        outputText = "تم التنفيذ بدون مخرجات.";
                    }

                    iframeDoc.open();
                    iframeDoc.write(`<html><body style='background:#1e1e1e; color:#4ade80; font-family:monospace; white-space:pre-wrap; padding:15px; direction:ltr; text-align:left;'>${escapeHtml(outputText)}</body></html>`);
                    iframeDoc.close();

                } catch (error) {
                    iframeDoc.open();
                    iframeDoc.write(`<html><body style='background:#1e1e1e; color:#ff4444; font-family:monospace; padding:15px; direction:ltr; text-align:left;'>حدث خطأ أثناء الاتصال بالخادم.</body></html>`);
                    iframeDoc.close();
                }
            } else {
                alert(`تشغيل لغة (${lang.toUpperCase()}) يتطلب بيئة تشغيل خلفية أو لم يتم ربطها بعد.`);
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function closeOutput() {
            document.getElementById('outputModal').style.display = 'none';
        }

        // تنسيق مبسط للكود (إزالة المسافات الزائدة وتنظيم الأسطر)
        function formatCode() {
            try {
                let code = codeArea.value;
                undoStack.push(code);
                // تنسيق أساسي عبر ترتيب الأسطر وإزالة الفراغات الزائدة
                code = code.split('\n').map(line => line.trim()).join('\n');
                codeArea.value = code;
                alert('تم تنسيق الكود بنجاح!');
            } catch (e) {
                alert('تعذر تنسيق الكود.');
            }
        }
    </script>
</body>
                                                                                  </html>
